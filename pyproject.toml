[project]
name = "stratifa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pgvector>=0.3,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyJWT>=2.9,<3",
    "python-dotenv>=1,<2",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog>=24,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27,<1",
    "ruff>=0.8",
    "mypy>=1.13",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["db: requires the Neon test branch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app.core"]
plugins = ["pydantic.mypy"]
